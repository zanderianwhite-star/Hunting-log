<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hunting Log — Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    .map-page { height: 100vh; display: flex; flex-direction: column; }
    .map-wrap { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }
    .map-hint {
      position: absolute;
      bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 20px;
      font-size: .74rem;
      color: var(--text-muted);
      pointer-events: none;
      z-index: 400;
      white-space: nowrap;
      box-shadow: var(--shadow);
      transition: opacity .4s;
    }
    .map-hint.hidden { opacity: 0; }
    .map-count {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(255,255,255,.95);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 14px;
      font-size: .78rem;
      font-weight: 600;
      color: var(--text);
      z-index: 400;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .count-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="map-page">
    <nav class="nav">
      <a href="index.html" class="nav-brand">
        <span class="nav-brand-name">Hunting Log</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link active always-show">Map</a>
        <a href="log.html"   class="nav-link always-show">Log</a>
      </div>
      <a href="add.html" class="nav-add">+ New Hunt</a>
    </nav>

    <div class="map-wrap" style="padding-top: var(--nav-h);">
      <div id="map"></div>
      <div class="map-count" id="map-count" style="display:none">
        <span class="count-dot"></span>
        <span id="count-text">0 hunts</span>
      </div>
      <div class="map-hint" id="map-hint">Add your first hunt to see it on the map</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="storage.js"></script>
  <script>
    const map = L.map('map', { center: [39.5, -98.35], zoom: 4 });

    // Satellite layer (Esri World Imagery — free, no API key)
    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Tiles &copy; Esri &mdash; Source: Esri, USGS, NOAA', maxZoom: 19 }
    ).addTo(map);

    // Labels layer on top of satellite
    L.tileLayer(
      'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      { attribution: '', maxZoom: 19, opacity: 0.8 }
    ).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    function renderMarkers() {
      markersLayer.clearLayers();
      const hunts = loadHunts();
      const countEl = document.getElementById('map-count');
      const hintEl  = document.getElementById('map-hint');
      const countTxt = document.getElementById('count-text');

      if (!hunts.length) {
        countEl.style.display = 'none';
        hintEl.classList.remove('hidden');
        return;
      }

      countEl.style.display = 'flex';
      countTxt.textContent = hunts.length + (hunts.length === 1 ? ' hunt' : ' hunts');
      hintEl.classList.add('hidden');

      hunts.forEach(h => {
        const icon = L.divIcon({
          className: '',
          html: `<div class="map-pin ${h.result}"><span class="pin-inner">${animalEmoji(h.animal)}</span></div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 36],
          popupAnchor: [0, -40],
        });

        const thumb = h.photos && h.photos[0]
          ? `<img src="${h.photos[0]}" style="width:100%;height:80px;object-fit:cover;border-radius:6px;margin-bottom:8px;display:block" />`
          : '';

        const popupHtml = `
          ${thumb}
          <div class="popup-animal">${escHtml(h.animal)}</div>
          <div class="popup-meta">
            ${formatDate(h.date)}<br>
            ${escHtml(h.gun)}<br>
            ${escHtml(h.location)}
          </div>
          <span class="pill ${h.result}" style="margin-bottom:10px;display:inline-flex">${h.result}</span><br>
          <a href="hunt.html?id=${h.id}" class="popup-view-btn">View Details →</a>
        `;

        L.marker([h.lat, h.lng], { icon })
          .addTo(markersLayer)
          .bindPopup(popupHtml, { maxWidth: 240 });
      });
    }

    renderMarkers();

    // Refresh if returning from add page
    window.addEventListener('focus', renderMarkers);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) renderMarkers();
    });
  </script>
</body>
</html>
